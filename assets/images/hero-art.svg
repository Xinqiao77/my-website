  <g transform="translate(118 12) scale(2.2)">
    <path d="M60 18 L60.6 19 L61.4 19.9 L62.4 20.8 L63.5 21.6 L64.6 22.4 L65.6 23.2 L66.3 24.2 L66.7 25.3 L66.7 26.5 L66.4 28 L65.6 29.6 L64.5 31.3 L63.2 33.1 L62.1 34.8 L61.4 36.4 L61.1 37.8 L61.2 39 L61.8 40 L62.9 40.8 L64.4 41.4 L66.3 41.9 L68.4 42.3 L70.6 42.6 L72.8 43 L74.8 43.4 L76.6 43.9 L78 44.6 L79 45.4 L79.5 46.5 L79.5 47.8 L79 49.2 L78.2 50.8 L77.1 52.5 L75.8 54.3 L74.5 56.2 L73.3 57.9 L72.3 59.6 L71.6 61.2 L71.3 62.5 L71.5 63.7 L72.2 64.7 L73.4 65.5 L75 66.1 L76.9 66.5 L79 66.9 L81.2 67.2 L83.4 67.6 L85.4 68 L87.1 68.6 L88.5 69.3 L89.4 70.1 L89.8 71.2 L89.7 72.5 L89.2 74 L88.3 75.6 L87.2 77.4 L85.9 79.2 L84.6 81 L83.4 82.7 L82.4 84.4 L81.8 85.9 L81.6 87.3 L81.9 88.4 L82.7 89.4 L83.9 90.1 L85.5 90.7 L87.5 91.1 L89.7 91.5 L91.7 91.9 L93.4 92.5 L94.6 93.2 L95.5 94.1 L96 95.1 L96.2 96.3 L96.1 97.6 L95.9 99 L95.7 100.3 L95.6 101.6 L95.7 102.9 L96 104"
