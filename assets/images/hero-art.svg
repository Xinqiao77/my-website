  <path d="M290 280 c10 -8 26 -6 30 6 c4 12 -6 22 -18 22 c-12 0 -20 -16 -12 -28 Z" fill="#D98A76" fill-opacity="0.45"/>
  <circle cx="336" cy="318" r="9" fill="#D98A76" fill-opacity="0.45"/>

