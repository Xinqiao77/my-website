  <circle cx="260" cy="260" r="186" stroke="#F7F3EE" stroke-opacity="0.08" stroke-width="1.5"/>
  <circle cx="260" cy="260" r="120" stroke="#F7F3EE" stroke-opacity="0.06" stroke-width="1.5"/>

  <!-- Normal cells -->
  <g stroke="#F7F3EE" stroke-opacity="0.55" stroke-width="2">
    <circle cx="112" cy="168" r="44"/>
    <circle cx="418" cy="150" r="36"/>
    <circle cx="128" cy="380" r="40"/>
    <circle cx="410" cy="392" r="48"/>
  </g>
  <g fill="#F7F3EE" fill-opacity="0.22">
